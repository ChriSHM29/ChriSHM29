name: GitHub Metrics Icons

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics Topics Icons
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICAS_TOKEN }}
          committer_token: ${{ secrets.METRICAS_TOKEN }}
          committer_branch: main
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24
