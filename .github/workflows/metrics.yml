name: GitHub Metrics

on:
  # Se actualiza automáticamente cada 24 horas a medianoche
  schedule: [{cron: "0 0 * * *"}]
  # Te permite ejecutarlo manualmente con un botón cuando quieras
  workflow_dispatch:
  # Se ejecuta al hacer push en main
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lowlighter Metrics (Overview, Languages & Isometric Calendar)
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: America/Lima
          
          # Tema oscuro limpio
           use_mocked_data: no
          template: classic
          config_order: base.header, base.metadata, languages, isocalendar, habits

          # Plugin de Lenguajes (con colores e iconos)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          # Plugin de Calendario Isométrico 3D (el cubo de commits)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Plugin de Hábitos (horas a las que programas y actividad reciente)
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
